version: "3.9"

services:
  vector-service:
    build: ./vector-service
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  model-service:
    build: ./model-service
    ports:
      - "8002:8002"
    environment:
      - VECTOR_SERVICE_URL=http://vector-service:8001
    depends_on:
      vector-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    depends_on:
      model-service:
        condition: service_healthy